version: 2

# One consolidated PR per ecosystem, once a week.
#
# Each ecosystem splits its updates into two groups:
#
#   *-dependencies  patch + minor — safe to merge as a batch. Security
#                   patches land here, so they are never held hostage by
#                   an unrelated major sitting in the same PR.
#   *-major         major only — reviewed one batch at a time, since a
#                   breaking change in a runtime dependency (ioredis,
#                   pino) can pass CI and still fail in production.
#
# `open-pull-requests-limit: 2` allows at most one of each group open per
# ecosystem, so nothing accumulates. Security updates are exempt from the
# limit and still arrive immediately.
updates:
  # All three npm projects (API, dashboard, docs-site) share one entry, so a
  # single weekly run covers every manifest instead of three independent
  # schedules. Dependabot groups across all of them in one pull request.
  - package-ecosystem: npm
    directories:
      - /
      - /dashboard
      - /docs-site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      npm-dependencies:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"
      npm-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"
      github-actions-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      docker:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"
      docker-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
